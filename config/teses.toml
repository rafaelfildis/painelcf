# Use esta seção apenas para corrigir ou acrescentar códigos.
[codigos_origem]

# Temas (teses) identificados por palavras-chave no inteiro teor. Uma sentença pode ter vários temas.
[temas]
"RMC/RCC (cartão consignado)" = ['\bRMC\b', '\bRCC\b', 'RESERVA\s+DE\s+MARGEM', 'CARTAO\s+DE\s+CREDITO\s+CONSIGNADO', 'CARTAO\s+(DE\s+)?BENEFICIO\s+CONSIGNADO']
"Empréstimo consignado" = ['EMPRESTIMO\s+CONSIGNADO', 'CONSIGNADO\s+(NAO|SEM)\s+(RECONHECIDO|CONTRATADO|AUTORIZADO)', 'DESCONTOS?\s+(NO|EM)\s+(SEU\s+)?BENEFICIO']
"Tarifas bancárias" = ['TARIFA', 'CESTA\s+(DE\s+)?SERVICOS', 'PACOTE\s+DE\s+SERVICOS', 'CESTA\s+FACIL']
"Seguro/título não contratado" = ['SEGURO\s+(NAO\s+CONTRATADO|PRESTAMISTA)', 'VENDA\s+CASADA', 'TITULO\s+DE\s+CAPITALIZACAO']
"Descontos indevidos" = ['DESCONTOS?\s+INDEVID', 'DEBITOS?\s+INDEVID', 'COBRANCAS?\s+INDEVID']
"Contratação não reconhecida/fraude" = ['NAO\s+RECONHEC', 'FRAUDE', 'FORTUITO\s+INTERNO', 'SUMULA\s+479', 'GOLPE']
"Negativação indevida" = ['NEGATIVA[CÇ]', 'INSCRICAO\s+INDEVIDA', '\bSPC\b', 'SERASA', 'CADASTROS?\s+(DE\s+)?(RESTRITIVOS|INADIMPLENTES|PROTECAO\s+AO\s+CREDITO)', 'SUMULA\s+385']
"Conta/cartão bloqueado" = ['BLOQUEIO\s+(DA|DE)\s+(CONTA|CARTAO|VALORES)', 'CONTA\s+BLOQUEADA']
"Energia elétrica" = ['ENERGIA\s+ELETRICA', 'COELBA', 'NEOENERGIA', 'RECUPERACAO\s+DE\s+CONSUMO', '\bTOI\b', 'SUSPENSAO\s+DO\s+FORNECIMENTO']
"Água/saneamento" = ['EMBASA', 'FORNECIMENTO\s+DE\s+AGUA', 'SANEAMENTO']
"Telefonia/internet" = ['TELEFONIA', 'LINHA\s+TELEFONICA', 'INTERNET', 'PLANO\s+(MOVEL|POS[- ]?PAGO|PRE[- ]?PAGO)', 'PORTABILIDADE']
"Transporte aéreo" = ['VOO', 'COMPANHIA\s+AEREA', 'BAGAGEM', 'OVERBOOKING', 'PASSAGEM\s+AEREA']
"Plano de saúde" = ['PLANO\s+DE\s+SAUDE', 'OPERADORA\s+DE\s+SAUDE', 'NEGATIVA\s+DE\s+COBERTURA', '\bANS\b']
"Comércio eletrônico/produto" = ['VICIO\s+DO\s+PRODUTO', 'PRODUTO\s+(NAO\s+ENTREGUE|DEFEITUOSO)', 'COMPRA\s+(ONLINE|PELA\s+INTERNET)', 'MARKETPLACE', 'ATRASO\s+NA\s+ENTREGA']
"Pix/transferência" = ['\bPIX\b', 'TRANSFERENCIA\s+(BANCARIA|NAO\s+RECONHECIDA)']

