# Configuração do módulo de teses — Calmon & Freitas Advogados
#
# Todas as expressões abaixo são aplicadas sobre o texto em MAIÚSCULAS e SEM ACENTOS
# (ex.: "Relações de Consumo" vira "RELACOES DE CONSUMO"). Use expressões regulares Python.

[coleta]
tribunal = "TJBA"
# "auto" tenta baixar o caderno completo do dia e, se não conseguir, consulta página a página.
# "paginado" consulta somente página a página; "caderno" exige o caderno.
modo = "auto"
itens_por_pagina = 100
# Pausa entre requisições, em segundos, para não estourar o limite da API (HTTP 429).
pausa_entre_requisicoes = 1.0
# Na primeira execução (banco vazio), quantos dias para trás coletar.
dias_iniciais = 3
# Limite de dias por execução quando houver dias atrasados a recuperar.
max_dias_por_execucao = 15

[filtros]
# Varas de Relações de Consumo (rito comum). Mude para false para analisar somente os Juizados listados abaixo.
incluir_varas_relacoes_consumo = true
varas_relacoes_consumo = [
  'REL(ACOES|ACAO|AC)?\.?\s+(DE\s+)?CONS',   # "VARA DE RELAÇÕES DE CONSUMO" / "V DOS FEITOS DE REL DE CONS CIV E COMERCIAIS"
]
# Como reconhecer um Juizado no nome do órgão. Juizados só entram se estiverem em [juizados_consumo].
juizado = ['SISTEMA\s+DOS\s+JUIZADOS', 'JUIZADOS?\s+ESPECIA', '\bVSJE\b']
# Varas mistas "de Relações de Consumo, Cíveis, Comerciais e Fazenda Pública" do interior continuam incluídas;
# saem apenas os Juizados da Fazenda Pública.
orgaos_excluir = [
  '(JUIZADOS?\s+ESPECIA\w*|VSJE)\s+(DA\s+)?FAZENDA',
  'TURMA\s+RECURSAL',
]
# Classes processuais admitidas e o rito correspondente.
[filtros.classes]
comum = ['PROCEDIMENTO\s+COMUM']
juizado = ['JUIZADO\s+ESPECIAL\s+CIVEL', 'PROCEDIMENTO\s+DO\s+JUIZADO']

# Juizados Especiais com atendimento a demandas de consumo (lista do escritório).
# varas = números das varas admitidas; [] = vara única ("Vara do Sistema dos Juizados Especiais").
# exigir = expressão que também precisa constar do nome do órgão.
